<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify 2.0 Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="logo">
                <h2>Spotify 2.0</h2>
            </div>
            <ul class="nav-links">
                <li class="active"><a href="#home"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="#search"><i class="fas fa-search"></i> Search</a></li>
                <li><a href="#albums"><i class="fas fa-compact-disc"></i> Albums</a></li>
                <li><a href="#genres"><i class="fas fa-guitar"></i> Genres</a></li>
                <li><a href="#playlists"><i class="fas fa-list"></i> Playlists</a></li>
            </ul>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Search Bar -->
            <div class="search-container">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search for songs, albums, artists...">
                </div>
            </div>

            <!-- Content Sections -->
            <div class="content-container">
                <!-- Home Section -->
                <section id="home" class="section active">
                    <h1>Welcome to Spotify 2.0</h1>
                    <h2>Featured Playlists</h2>
                    <div class="playlist-grid">
                        <!-- Playlists will be loaded here dynamically -->
                    </div>
                    
                    <h2>Recently Added</h2>
                    <div class="songs-container">
                        <!-- Recently added songs will be loaded here dynamically -->
                    </div>
                </section>

                <!-- Search Section -->
                <section id="search" class="section">
                    <h1>Search Results</h1>
                    <div class="search-results">
                        <!-- Search results will be loaded here dynamically -->
                    </div>
                </section>

                <!-- Albums Section -->
                <section id="albums" class="section">
                    <h1>Albums</h1>
                    <div class="albums-grid">
                        <!-- Albums will be loaded here dynamically -->
                    </div>
                </section>

                <!-- Album Detail Section (Hidden by default) -->
                <section id="album-detail" class="section">
                    <div class="album-header">
                        <div class="back-button"><i class="fas fa-arrow-left"></i></div>
                        <div class="album-info">
                            <!-- Album info will be loaded here dynamically -->
                        </div>
                    </div>
                    <div class="album-tracks">
                        <!-- Album tracks will be loaded here dynamically -->
                    </div>
                </section>

                <!-- Genres Section -->
                <section id="genres" class="section">
                    <h1>Genres</h1>
                    <div class="genres-container">
                        <!-- Genre filters will be loaded here dynamically -->
                    </div>
                    <div class="genre-songs">
                        <!-- Genre-filtered songs will be loaded here dynamically -->
                    </div>
                </section>

                <!-- Playlists Section -->
                <section id="playlists" class="section">
                    <h1>Playlists</h1>
                    <div class="playlists-grid">
                        <!-- Playlists will be loaded here dynamically -->
                    </div>
                </section>

                <!-- Playlist Detail Section (Hidden by default) -->
                <section id="playlist-detail" class="section">
                    <div class="playlist-header">
                        <div class="back-button"><i class="fas fa-arrow-left"></i></div>
                        <div class="playlist-info">
                            <!-- Playlist info will be loaded here dynamically -->
                        </div>
                    </div>
                    <div class="playlist-tracks">
                        <!-- Playlist tracks will be loaded here dynamically -->
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Music Player (Fixed at bottom) -->
    <div class="music-player">
        <div class="song-info">
            <img id="current-song-cover" src="https://images.unsplash.com/photo-1507874457470-272b3c8d8ee2" alt="Album Cover">
            <div class="song-details">
                <p id="current-song-title">Select a song</p>
                <p id="current-song-artist">-</p>
            </div>
        </div>
        
        <div class="player-controls">
            <div class="control-buttons">
                <button id="shuffle-btn"><i class="fas fa-random"></i></button>
                <button id="prev-btn"><i class="fas fa-step-backward"></i></button>
                <button id="play-btn"><i class="fas fa-play"></i></button>
                <button id="next-btn"><i class="fas fa-step-forward"></i></button>
                <button id="repeat-btn"><i class="fas fa-redo"></i></button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar">
                    <div class="progress"></div>
                </div>
                <span id="duration">0:00</span>
            </div>
        </div>
        
        <div class="volume-control">
            <i class="fas fa-volume-up" id="volume-icon"></i>
            <div class="volume-slider">
                <div class="volume-progress"></div>
            </div>
        </div>
        
        <audio id="audio-player"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
